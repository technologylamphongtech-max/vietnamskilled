        fastcgi_param SCRIPT_FILENAME /var/www/vietnamskilled.org/cms/public.php;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
    }
    location = /tin-tuc.html { return 301 /tin-tuc/$is_args$args; }
    location = /tin-tuc/index.html { return 301 /tin-tuc/$is_args$args; }
    location = /robots.txt {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/vietnamskilled.org/cms/public.php;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
    }
    location = /sitemap.xml {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/vietnamskilled.org/cms/public.php;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
    }
    location = /admin/tin-tuc/ {
        client_max_body_size 10m;
        fastcgi_param PHP_VALUE "upload_max_filesize=8M\npost_max_size=10M";
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/vietnamskilled.org/cms/admin.php;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
    }
    location = /admin/seo/ {
        client_max_body_size 10m;
        fastcgi_param PHP_VALUE "upload_max_filesize=8M\npost_max_size=10M";
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/vietnamskilled.org/cms/admin.php;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
    }
    location ~ "^/tin-tuc/(?:[a-z0-9-]{1,110}/?|media/[a-f0-9]{32}\.(?:jpg|png|webp|gif|avif))$" {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/vietnamskilled.org/cms/public.php;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
    }
    location ^~ /cms-assets/ { try_files $uri =404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # HTML pages: never cache
    location ~* \.html?$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        access_log off;
    }

    # Other static assets: always revalidate
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    access_log /var/log/nginx/vietnamskilled.org.access.log;
    error_log /var/log/nginx/vietnamskilled.org.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vietnamskilled.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vietnamskilled.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = vietnamskilled.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name vietnamskilled.org www.vietnamskilled.org;
    return 404; # managed by Certbot

}
