server {
    server_name vietnamskilled.org www.vietnamskilled.org;

    root /var/www/vietnamskilled.org/public_html;
    index index.html;

    # PHP send-mail endpoint
    location = /lien-he/send-mail.php {
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    # Admin panel
    location = /admin/ {
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php;
    }
    location = /admin/index.php {
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Static multi-page site routing
    location = / {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/vietnamskilled.org/cms/public.php;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
    }
    location = /index.html { return 301 /$is_args$args; }
